let coins = 50;
let currentIndex = 0;
let selectedAnswers = [];
let questions = [];
let timeLeft = 7200;

function updateCoins() {
    document.getElementById('coin-count').textContent = coins;
}

function showSection(sec) {
    document.querySelectorAll('#home, #test, #result, #games, #shop').forEach(d => d.classList.add('hidden'));
    document.getElementById(sec).classList.remove('hidden');
    if (sec === 'test') startTest();
}

function startTest() {
    questions = [...allQuestions].sort(() => Math.random() - 0.5);
    selectedAnswers = new Array(100).fill(null);
    currentIndex = 0;
    timeLeft = 7200;
    renderQuestion();
    startTimer();
}

function startTimer() {
    const timerEl = document.getElementById('timer');
    if (window.timerInt) clearInterval(window.timerInt);
    window.timerInt = setInterval(() => {
        timeLeft--;
        const h = String(Math.floor(timeLeft/3600)).padStart(2,'0');
        const m = String(Math.floor((timeLeft%3600)/60)).padStart(2,'0');
        const s = String(timeLeft%60).padStart(2,'0');
        timerEl.textContent = `${h}:${m}:${s}`;
        if (timeLeft <= 0) finishTest(true);
    }, 1000);
}

function renderQuestion() {
    const q = questions[currentIndex];
    document.getElementById('current-q').textContent = currentIndex + 1;
    document.getElementById('question-text').innerHTML = `<strong>${currentIndex+1}.</strong> ${q.q}`;
    
    const progressPercent = Math.round(((currentIndex + 1) / 100) * 100);
    document.getElementById('progress').style.width = `${progressPercent}%`;

    let html = '';
    q.a.forEach((opt,i) => {
        const sel = selectedAnswers[currentIndex] === i;
        html += `<div onclick="selectAnswer(${i})" class="p-8 border-2 ${sel ? 'border-purple-600 bg-purple-100' : 'border-gray-200'} rounded-3xl text-xl cursor-pointer transition">${String.fromCharCode(65+i)}. ${opt}</div>`;
    });
    document.getElementById('options').innerHTML = html;
}

function selectAnswer(i) {
    selectedAnswers[currentIndex] = i;
    renderQuestion();
}

function nextQuestion() {
    if(currentIndex < 99) {
        currentIndex++;
        renderQuestion();
    } else {
        finishTest(false);
    }
}

function prevQuestion() {
    if(currentIndex > 0) {
        currentIndex--;
        renderQuestion();
    }
}

function finishTest() {
    clearInterval(window.timerInt);
    let correct = 0;
    questions.forEach((q,i) => { if(selectedAnswers[i] === q.correct) correct++; });

    const percent = Math.round((correct / 100) * 100);
    let rating = "";
    let color = "";

    if(percent >= 85) { rating = "🎉 ALO! Juda zo‘r!"; color = "text-green-600"; }
    else if(percent >= 70) { rating = "👍 YAXSHI natija!"; color = "text-blue-600"; }
    else if(percent >= 50) { rating = "😐 O‘RTACHA"; color = "text-yellow-600"; }
    else { rating = "😕 Yana urinib ko‘ring!"; color = "text-red-600"; }

    const earned = Math.floor(correct * 0.8);
    coins += earned;
    updateCoins();

    document.getElementById('percent').innerHTML = `<span class="${color}">${percent}%</span>`;
    document.getElementById('rating').innerHTML = `<span class="${color}">${rating}</span>`;
    document.getElementById('correct-count').textContent = correct;

    const circle = document.getElementById('score-circle');
    circle.textContent = percent + "%";
    circle.style.borderColor = percent >= 70 ? "#22c55e" : percent >= 50 ? "#eab308" : "#ef4444";

    showSection('result');
}

function restartTest() {
    showSection('test');
}

// O‘yin va Sovrinlar (oldingi versiyadan)
function startStarGame() {
    let score = 0;
    const area = document.createElement('div');
    area.className = "relative h-96 bg-gradient-to-br from-purple-900 to-pink-900 rounded-3xl mx-auto max-w-2xl mt-10 overflow-hidden";
    area.innerHTML = `<div class="absolute top-6 left-6 text-3xl font-bold z-10 text-white">Yulduz: <span id="stars-count">0</span></div>`;
    document.getElementById('games').innerHTML = `<h2 class="text-5xl font-bold text-center mb-8">Yulduzlarni Ushla! ⭐</h2>`;
    document.getElementById('games').appendChild(area);

    const int = setInterval(() => {
        const s = document.createElement('div');
        s.textContent = '⭐';
        s.style.position = 'absolute';
        s.style.fontSize = '45px';
        s.style.left = Math.random()*85 + '%';
        s.style.top = Math.random()*70 + '%';
        s.style.cursor = 'pointer';
        s.onclick = () => { score++; document.getElementById('stars-count').textContent = score; s.remove(); };
        area.appendChild(s);
        setTimeout(() => s.remove(), 1300);
    }, 250);

    setTimeout(() => {
        clearInterval(int);
        const earned = Math.floor(score / 2) + 8;
        coins += earned;
        updateCoins();
        alert(`🎉 O‘yin tugadi!\n${score} ta yulduz ushladingiz.\n${earned} ta koin oldingiz!`);
        showSection('shop');
    }, 8000);
}

    let html = '';
    rewards.forEach((r,i) => {
        html += `
            <div class="bg-white/95 text-gray-900 p-10 rounded-3xl shadow-xl">
                <h3 class="text-2xl font-bold mb-4">${r.name}</h3>
                <p class="text-4xl font-bold text-yellow-500 mb-6">${r.cost} koin</p>
                <button onclick="buyReward(${i})" class="w-full py-5 bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-3xl font-bold">Sotib olish</button>
            </div>`;
    });
    document.getElementById('shop-items').innerHTML = html;
}

function buyReward(i) {
    const r = rewards[i];
    if (coins >= r.cost) {
        coins -= r.cost;
        updateCoins();
        alert(`✅ ${r.name} sotib olindi!`);
    } else {
        alert("Yetarli koin yo‘q!");
    }
}

window.onload = () => {
    updateCoins();
    renderShop();
    showSection('home');
};
</script>
</body>
</html>
