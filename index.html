<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3-Sinf To'liq Test - Manga Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;family=Comic+Neue:wght@400;700&amp;display=swap');
        body { font-family: 'Poppins', sans-serif; }
        .manga-title { font-family: 'Comic Neue', cursive; }
        .option:hover { transform: scale(1.03); background-color: #f3e8ff; }
        .option.selected { background-color: #6366f1; color: white; border-color: #4f46e5; }
        .timer { font-variant-numeric: tabular-nums; }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-50 to-indigo-50">

<header class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-xl sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
        <div class="flex items-center gap-4">
            <span class="text-5xl">📘</span>
            <div>
                <h1 class="text-4xl font-bold manga-title">3-SINF TO‘LIQ TEST</h1>
                <p class="text-indigo-200">100 savol • 2 soat</p>
            </div>
        </div>
        <div class="text-right text-sm">
            Matematika • Ona tili • O‘qish
        </div>
    </div>
</header>

<div class="max-w-6xl mx-auto p-6">
    <div id="test-screen">
        <div class="bg-white rounded-3xl shadow-2xl p-8 mb-8">
            <div class="flex justify-between items-center mb-8">
                <div>
                    <h2 id="subject-title" class="text-2xl font-bold">3-sinf Umumiy Test</h2>
                </div>
                <div class="text-center">
                    <div class="text-xs uppercase text-gray-400">Qolgan vaqt</div>
                    <div id="timer" class="text-5xl font-bold text-red-500 font-mono">02:00:00</div>
                </div>
                <div>
                    Savol <span id="current-q" class="text-4xl font-bold text-indigo-600">1</span>/100
                </div>
            </div>

            <div class="h-3 bg-gray-100 rounded-full mb-10 overflow-hidden">
                <div id="progress" class="h-full bg-gradient-to-r from-indigo-500 to-purple-600 w-[1%]"></div>
            </div>

            <div id="question-text" class="text-2xl font-medium leading-relaxed text-gray-800 mb-10 min-h-[110px]"></div>

            <div id="options" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>

        <div class="flex justify-between px-4">
            <button onclick="prevQuestion()" class="flex items-center gap-3 px-8 py-4 border-2 border-gray-300 hover:border-gray-400 rounded-2xl font-semibold">
                <i class="fas fa-arrow-left"></i> Oldingi
            </button>
            <button onclick="nextQuestion()" class="flex items-center gap-3 px-10 py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-semibold shadow-lg">
                Keyingi <i class="fas fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <!-- Natija -->
    <div id="result-screen" class="hidden text-center bg-white rounded-3xl shadow-2xl p-16 max-w-2xl mx-auto mt-12">
        <div id="result-emoji" class="text-8xl mb-6"></div>
        <h2 id="score-text" class="text-6xl font-bold mb-3"></h2>
        <p id="grade-text" class="text-3xl font-semibold text-emerald-600 mb-10"></p>
        
        <div class="grid grid-cols-3 gap-8 my-12">
            <div><div id="correct-count" class="text-5xl font-bold text-emerald-600"></div><div class="text-gray-500">To‘g‘ri</div></div>
            <div><div id="wrong-count" class="text-5xl font-bold text-red-500"></div><div class="text-gray-500">Noto‘g‘ri</div></div>
            <div><div id="percent" class="text-5xl font-bold text-amber-500"></div><div class="text-gray-500">Foiz</div></div>
        </div>
        
        <button onclick="restartTest()" class="px-14 py-6 bg-gradient-to-r from-indigo-600 to-purple-600 text-white text-2xl font-bold rounded-3xl hover:scale-105 transition-all">
            Yana ishlash
        </button>
    </div>
</div>

let currentIndex = 0;
let selectedAnswers = new Array(100).fill(null);
let timeLeft = 7200; // 2 soat
let timerInterval;

function startTimer() {
    timerInterval = setInterval(() => {
        timeLeft--;
        const h = String(Math.floor(timeLeft / 3600)).padStart(2, '0');
        const m = String(Math.floor((timeLeft % 3600) / 60)).padStart(2, '0');
        const s = String(timeLeft % 60).padStart(2, '0');
        document.getElementById('timer').textContent = `${h}:${m}:${s}`;
        if (timeLeft <= 0) finishTest(true);
    }, 1000);
}

function renderQuestion() {
    const q = questions[currentIndex];
    document.getElementById('current-q').textContent = currentIndex + 1;
    document.getElementById('question-text').innerHTML = `<strong>${currentIndex + 1}.</strong> ${q.q}`;
    
    const progress = ((currentIndex + 1) / 100) * 100;
    document.getElementById('progress').style.width = `${progress}%`;

    let html = '';
    q.a.forEach((option, i) => {
        const isSelected = selectedAnswers[currentIndex] === i;
        html += `
            <div onclick="selectAnswer(${i})" class="option border-2 ${isSelected ? 'border-indigo-600 selected' : 'border-gray-200'} p-6 rounded-2xl text-lg cursor-pointer">
                ${String.fromCharCode(65 + i)}. ${option}
            </div>`;
    });
    document.getElementById('options').innerHTML = html;
}

function selectAnswer(i) {
    selectedAnswers[currentIndex] = i;
    renderQuestion();
}

function nextQuestion() {
    if (currentIndex < 99) {
        currentIndex++;
        renderQuestion();
    } else {
        finishTest(false);
    }
}

function prevQuestion() {
    if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
    }
}

function finishTest(timeUp) {
    clearInterval(timerInterval);
    let correct = 0;
    questions.forEach((q, i) => {
        if (selectedAnswers[i] === q.correct) correct++;
    });

    document.getElementById('test-screen').classList.add('hidden');
    const res = document.getElementById('result-screen');
    res.classList.remove('hidden');

    document.getElementById('correct-count').textContent = correct;
    document.getElementById('wrong-count').textContent = 100 - correct;
    const percent = Math.round((correct / 100) * 100);
    document.getElementById('percent').textContent = percent + '%';
    document.getElementById('score-text').textContent = `${correct} / 100`;

    let msg = "", emoji = "";
    if (correct >= 80) { msg = "A'LO daraja! 🎉"; emoji = "🏆"; }
    else if (correct >= 60) { msg = "Yaxshi natija! 👍"; emoji = "👍"; }
    else if (correct >= 40) { msg = "Qoniqarli"; emoji = "📚"; }
    else { msg = "Ko‘proq mashq qiling 💪"; emoji = "📖"; }

    document.getElementById('grade-text').innerHTML = msg;
    document.getElementById('result-emoji').textContent = emoji;

    if (timeUp) alert("Vaqt tugadi! Natijangiz avtomatik hisoblandi.");
}

function restartTest() {
    location.reload();
}

// Boshlash
window.onload = () => {
    renderQuestion();
    startTimer();
};
</script>
