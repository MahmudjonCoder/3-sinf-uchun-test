<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3-Sinf Magic World ✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Comic+Neue:wght@700&display=swap');
        
        body { font-family: 'Poppins', sans-serif;
        background: linear-gradient(to right, #1e0c4f, #4b0082);
    }
        
        .hero-bg {
            background: linear-gradient(rgba(30,0,80,0.75), rgba(120,0,120,0.85)), 
                        url('https://images.unsplash.com/photo-1519681393784-d120267933ba?ixlib=rb-4.0.3&auto=format&fit=crop&q=80') center/cover fixed;
            animation: parallax 35s linear infinite;
        }
        @keyframes parallax { 0% {background-position: center 20%;} 100% {background-position: center 80%;} }
        
        .floating-3d { animation: float3D 7s ease-in-out infinite; }
        @keyframes float3D { 0%,100% {transform: translateY(0) rotate(0deg);} 50% {transform: translateY(-60px) rotate(15deg);} }
        
        .test-card {
            transition: all 0.6s cubic-bezier(0.34,1.56,0.64,1);
            transform: perspective(1500px) rotateX(20deg) rotateY(15deg);
        }
        .test-card:hover {
            transform: perspective(1500px) rotateX(5deg) rotateY(5deg) scale(1.04);
        }
    </style>
</head>
<body class="text-white min-h-screen">

<header class="bg-white/10 backdrop-blur-xl border-b border-white/30 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-8 py-5 flex justify-between items-center">
        <div class="text-3xl font-bold flex items-center gap-3">🪄 3-Sinf Magic</div>
        <div class="flex gap-8 text-lg font-medium">
            <a onclick="showSection('home')" class="cursor-pointer hover:text-yellow-300">Bosh sahifa</a>
            <a onclick="showSection('test')" class="cursor-pointer hover:text-yellow-300">Test</a>
            <a onclick="showSection('games')" class="cursor-pointer hover:text-yellow-300">O‘yinlar</a>
            <a onclick="showSection('shop')" class="cursor-pointer hover:text-yellow-300">Sovrinlar <span id="coin-count" class="bg-yellow-400 text-black px-3 py-1 rounded-full text-sm font-bold">50</span></a>
        </div>
    </div>
</header>

<!-- BOSH SAHIFA (3D) -->
<div id="home" class="hero-bg min-h-screen flex items-center justify-center relative">
    <div class="absolute inset-0 pointer-events-none">
        <div class="floating-3d absolute top-20 left-16 text-8xl">📖</div>
        <div class="floating-3d absolute top-40 right-24 text-7xl" style="animation-delay:1s">⭐</div>
        <div class="floating-3d absolute bottom-32 left-36 text-7xl" style="animation-delay:2.3s">🧠</div>
        <div class="floating-3d absolute bottom-48 right-32 text-8xl" style="animation-delay:1.6s">✨</div>
    </div>
    <div class="relative z-10 text-center px-6">
        <h1 class="text-7xl md:text-8xl font-bold mb-6">3-SINF MAGIC WORLD</h1>
        <p class="text-3xl mb-12">Test ishlang, o‘yin o‘ynang, sovrin yuting!</p>
        <div class="flex justify-center gap-6">
            <button onclick="showSection('test')" class="px-16 py-7 bg-white text-purple-700 text-3xl font-bold rounded-3xl shadow-2xl">TEST BOSHLASH</button>
            <button onclick="showSection('games')" class="px-16 py-7 bg-yellow-400 text-black text-3xl font-bold rounded-3xl shadow-2xl">O‘YINLAR</button>
        </div>
    </div>
</div>

<!-- TEST -->
<div id="test" class="hidden max-w-5xl mx-auto p-8">
    <div class="test-card bg-white/95 text-gray-900 rounded-3xl p-12 shadow-2xl">
        <div class="flex justify-between mb-8">
            <h2 class="text-4xl font-bold">3-Sinf To‘liq Test</h2>
            <div id="timer" class="text-5xl font-bold text-red-500">02:00:00</div>
        </div>
        <div class="flex justify-between mb-8">
            <span>Savol <span id="current-q" class="text-4xl font-bold text-purple-600">1</span>/100</span>
            <div class="w-96 h-3 bg-gray-200 rounded-full"><div id="progress" class="h-3 bg-gradient-to-r from-purple-600 to-pink-600 rounded-full" style="width:1%"></div></div>
        </div>
        <div id="question-text" class="text-3xl font-semibold mb-12"></div>
        <div id="options" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </div>
    <div class="flex justify-between mt-8">
        <button onclick="prevQuestion()" class="px-10 py-5 bg-white/20 rounded-3xl">← Oldingi</button>
        <button onclick="nextQuestion()" class="px-12 py-5 bg-purple-600 rounded-3xl font-bold">Keyingi →</button>
    </div>
</div>

<!-- O‘YINLAR -->
<div id="games" class="hidden max-w-4xl mx-auto p-8 text-center">
    <h2 class="text-5xl font-bold mb-12">Yulduzlarni Ushla! ⭐</h2>
    <button onclick="startStarGame()" class="px-16 py-8 bg-yellow-400 text-black text-3xl font-bold rounded-3xl">O‘yinni Boshlash</button>
</div>

<!-- SOVRINLAR -->
<div id="shop" class="hidden max-w-5xl mx-auto p-8">
    <h2 class="text-5xl font-bold text-center mb-10">Sovrinlar Do‘koni 🏆</h2>
    <div id="shop-items" class="grid md:grid-cols-2 gap-8"></div>
</div>

<script>
// ==================== 100 TA SAVOL ====================
const allQuestions = [
    // Matematika 1-40
    {q:"25+17=?", a:["40","42","43","41"], correct:1},
    {q:"56−19=?", a:["37","38","39","36"], correct:0},
    {q:"8×7=?", a:["54","56","48","64"], correct:1},
    {q:"63÷9=?", a:["6","8","7","9"], correct:2},
    {q:"100−45=?", a:["55","45","65","60"], correct:0},
    {q:"36+28=?", a:["62","63","64","65"], correct:2},
    {q:"9×6=?", a:["54","56","48","52"], correct:0},
    {q:"72÷8=?", a:["8","9","7","6"], correct:0},
    {q:"45+15=?", a:["55","60","65","70"], correct:1},
    {q:"90−27=?", a:["63","64","62","61"], correct:0},
    {q:"7×8=?", a:["48","54","56","64"], correct:2},
    {q:"42÷6=?", a:["6","7","8","9"], correct:1},
    {q:"18+29=?", a:["47","46","48","49"], correct:0},
    {q:"75−38=?", a:["36","37","38","39"], correct:1},
    {q:"5×9=?", a:["40","45","50","35"], correct:1},
    {q:"64÷8=?", a:["6","7","8","9"], correct:2},
    {q:"49+11=?", a:["59","60","61","62"], correct:1},
    {q:"81−29=?", a:["51","52","53","54"], correct:1},
    {q:"6×6=?", a:["36","42","30","32"], correct:0},
    {q:"27÷3=?", a:["8","9","7","6"], correct:1},
    {q:"13+18=?", a:["30","31","32","33"], correct:1},
    {q:"50−17=?", a:["33","34","35","32"], correct:1},
    {q:"8×5=?", a:["45","40","35","30"], correct:1},
    {q:"54÷6=?", a:["7","8","9","6"], correct:1},
    {q:"29+31=?", a:["60","59","61","62"], correct:0},
    {q:"68−18=?", a:["50","49","51","48"], correct:0},
    {q:"4×9=?", a:["36","32","40","38"], correct:0},
    {q:"35÷5=?", a:["5","6","7","8"], correct:1},
    {q:"47+23=?", a:["69","70","71","72"], correct:1},
    {q:"91−41=?", a:["49","50","51","52"], correct:1},
    {q:"3×8=?", a:["21","24","27","18"], correct:1},
    {q:"18÷2=?", a:["8","9","10","7"], correct:0},
    {q:"16+15=?", a:["31","32","30","29"], correct:0},
    {q:"44−19=?", a:["24","25","26","27"], correct:1},
    {q:"7×5=?", a:["30","35","40","45"], correct:1},
    {q:"81÷9=?", a:["8","9","7","6"], correct:1},
    {q:"39+12=?", a:["50","51","52","53"], correct:1},
    {q:"73−25=?", a:["47","48","49","50"], correct:1},
    {q:"2×9=?", a:["16","18","20","22"], correct:1},
    {q:"40÷5=?", a:["7","8","9","6"], correct:3},

    // Ona tili va O'qish (oldingi savollar)
    {q:"O‘zbek tilida nechta unli harf bor?", a:["5","6","7","8"], correct:1},
    {q:"'Kitob' so‘zi nechta bo‘g‘in?", a:["1","2","3","4"], correct:1},
    {q:"'Ona' so‘zining birinchi harfi?", a:["A","O","N","I"], correct:1},
    {q:"Qaysi biri meva?", a:["Olma","Stol","Kitob","Qalam"], correct:0},
    {q:"Gap nimadan boshlanadi?", a:["Kichik harf","Katta harf","Nuqta","Vergul"], correct:1},
    {q:"Gap oxiriga nima qo‘yiladi?", a:["Vergul","Nuqta","Ikki nuqta","Tire"], correct:1},
    {q:"Qaysi so‘z ot?", a:["Yugurdi","Daraxt","Chiroyli","Tez"], correct:1},
    {q:"Qaysi so‘z fe'l?", a:["O‘qidi","Kitob","Bola","Stol"], correct:0},
    {q:"'Go‘zal' qanday so‘z?", a:["Ot","Fe'l","Sifat","Son"], correct:2},
    {q:"'Uch' qanday so‘z?", a:["Son","Ot","Fe'l","Sifat"], correct:0},
    {q:"Ertak qahramoni kim?", a:["Qahramon","Daraxt","Kitob","Stol"], correct:0},
    {q:"Ertaklar qanday tugaydi?", a:["Xursandchilik bilan","Urush bilan","Tugamaydi","Bilmayman"], correct:0},
    {q:"Maqol nima?", a:["Dono fikr","Ertak","She‘r","Hikoya"], correct:0},
    {q:"O‘qishning foydasi nima?", a:["Bilim beradi","Charchatadi","Kasal qiladi","Uyqu keltiradi"], correct:0}
];

let coins = 50;
let playerName = "", playerSurname = "";

function askName() {
    playerName = prompt("Ismingizni kiriting:", "Azizbek") || "O'quvchi";
    playerSurname = prompt("Familiyangizni kiriting:", "Valiev") || "";
}

function updateCoins() {
    document.getElementById('coin-count').textContent = coins;
}

function showSection(sec) {
    document.querySelectorAll('#home, #test, #games, #shop').forEach(d => d.classList.add('hidden'));
    document.getElementById(sec).classList.remove('hidden');
    if (sec === 'test') startTest();
}

// Test
let questions = [], currentIndex = 0, selectedAnswers = [], timeLeft = 7200;

function startTest() {
    if (!playerName) askName();
    questions = allQuestions.sort(() => Math.random() - 0.5);
    selectedAnswers = new Array(questions.length).fill(null);
    currentIndex = 0;
    timeLeft = 7200;
    renderQuestion();
    startTimer();
}

function startTimer() {
    const timerEl = document.getElementById('timer');
    if (window.timerInt) clearInterval(window.timerInt);
    window.timerInt = setInterval(() => {
        timeLeft--;
        const h = String(Math.floor(timeLeft/3600)).padStart(2,'0');
        const m = String(Math.floor((timeLeft%3600)/60)).padStart(2,'0');
        const s = String(timeLeft%60).padStart(2,'0');
        timerEl.textContent = `${h}:${m}:${s}`;
        if (timeLeft <= 0) finishTest(true);
    }, 1000);
}

function renderQuestion() {
    const q = questions[currentIndex];
    document.getElementById('current-q').textContent = currentIndex + 1;
    document.getElementById('question-text').innerHTML = `<strong>${currentIndex+1}.</strong> ${q.q}`;
    document.getElementById('progress').style.width = `${((currentIndex+1)/questions.length)*100}%`;

    let html = '';
    q.a.forEach((opt, i) => {
        const sel = selectedAnswers[currentIndex] === i;
        html += `<div onclick="selectAnswer(${i})" class="p-8 border-2 ${sel ? 'border-purple-600 bg-purple-100' : 'border-gray-200'} rounded-3xl text-xl cursor-pointer">${String.fromCharCode(65+i)}. ${opt}</div>`;
    });
    document.getElementById('options').innerHTML = html;
}

function selectAnswer(i) { selectedAnswers[currentIndex] = i; renderQuestion(); }
function nextQuestion() { if (currentIndex < questions.length-1) { currentIndex++; renderQuestion(); } else finishTest(false); }
function prevQuestion() { if (currentIndex > 0) { currentIndex--; renderQuestion(); } }

function finishTest() {
    clearInterval(window.timerInt);
    let correct = 0;
    questions.forEach((q,i) => { if(selectedAnswers[i] === q.correct) correct++; });
    const earned = Math.floor(correct * 0.8) + 10;
    coins += earned;
    updateCoins();
    alert(`🎉 Tabriklaymiz, ${playerName}!\nTo'g'ri: ${correct}/${questions.length}\nSiz ${earned} ta koin oldingiz!`);
    showSection('shop');
}

// O'yin
function startStarGame() {
    if (!playerName) askName();
    let score = 0;
    const area = document.createElement('div');
    area.className = "relative h-96 bg-gradient-to-br from-purple-900 to-pink-900 rounded-3xl mx-auto max-w-2xl mt-10 overflow-hidden";
    area.innerHTML = `<div class="absolute top-6 left-6 text-3xl font-bold z-10 text-white">Yulduz: <span id="stars-count">0</span></div>`;
    document.getElementById('games').innerHTML = `<h2 class="text-5xl font-bold text-center mb-8">Yulduzlarni Ushla! ⭐</h2>`;
    document.getElementById('games').appendChild(area);

    const int = setInterval(() => {
        const s = document.createElement('div');
        s.textContent = '⭐';
        s.style.position = 'absolute';
        s.style.fontSize = '45px';
        s.style.left = Math.random()*85 + '%';
        s.style.top = Math.random()*70 + '%';
        s.style.cursor = 'pointer';
        s.onclick = () => { score++; document.getElementById('stars-count').textContent = score; s.remove(); };
        area.appendChild(s);
        setTimeout(() => s.remove(), 1300);
    }, 250);

    setTimeout(() => {
        clearInterval(int);
        const earned = Math.floor(score / 2) + 8;
        coins += earned;
        updateCoins();
        alert(`O'yin tugadi!\n${score} ta yulduz ushladingiz.\n${earned} ta koin qo'shildi!`);
        showSection('shop');
    }, 8000);
}

// Sovrinlar
const rewards = [
    {name: "Shokolad uchun Tashakkurnoma", cost: 25},
    {name: "Ota-onamga Rahmat", cost: 35},
    {name: "A'lo O'quvchi Diplomi", cost: 40},
    {name: "Yulduzli Medal", cost: 20}
];

function renderShop() {
    let html = '';
    rewards.forEach((r,i) => {
        html += `
            <div class="card-3d bg-white/95 text-gray-900 p-10 rounded-3xl shadow-xl">
                <h3 class="text-2xl font-bold mb-4">${r.name}</h3>
                <p class="text-4xl font-bold text-yellow-500 mb-6">${r.cost} koin</p>
                <button onclick="buyReward(${i})" class="w-full py-5 bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-3xl font-bold">Sotib olish</button>
            </div>`;
    });
    document.getElementById('shop-items').innerHTML = html;
}

function buyReward(i) {
    const r = rewards[i];
    if (coins >= r.cost) {
        coins -= r.cost;
        updateCoins();
        generateCertificate(r.name);
    } else {
        alert("Yetarli koin yo'q!");
    }
}

function generateCertificate(title) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFontSize(26);
    doc.text(title, 105, 40, { align: "center" });
    doc.setFontSize(18);
    doc.text(`Hurmatli ${playerName} ${playerSurname}`, 105, 70, { align: "center" });
    doc.text("Siz ajoyib natijalarga erishdingiz!", 105, 90, { align: "center" });
    doc.save(`${title}.pdf`);
}

// Boshlash
window.onload = () => {
    updateCoins();
    renderShop();
    showSection('home');
};
</script>
</body>
</html>
